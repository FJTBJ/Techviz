# 追加到主站 /opt/tmm/deploy/nginx/default.conf 末尾的 443 server 块。
#
# 用途：把 https://web3d.sfjabs.cn 反代到 web3d-nginx 容器（/opt/web3d 独立 compose 项目）。
# 外层只做 TLS 终止 + Basic Auth，静态资源与 /api 都由内层 nginx 处理。
#
# 注意：本文件是「需求副本」，实际生效的是服务器上的 default.conf。
# 改这里不会影响线上，必须同步到服务器并 nginx -t 通过后 reload。

server {
    listen 443 ssl;
    server_name web3d.sfjabs.cn;

    ssl_certificate     /etc/nginx/certs/web3d-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/web3d-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic "Web3D Previz";
    auth_basic_user_file /etc/nginx/auth/web3d.htpasswd;

    client_max_body_size 4m;

    # 同 leyo 站：变量式 proxy_pass，web3d-nginx 未启动时不影响主站配置加载
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web3d_upstream http://web3d-nginx:80;

    location / {
        proxy_pass $web3d_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
