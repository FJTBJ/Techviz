# Web3D 技术预演 · 内层 nginx（容器内 80，仅 edge 网络可达）
# 外层 tmm-nginx 负责 TLS / Basic Auth，然后整体反代到这里。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 4m;

    # 后端 API：变量式 proxy_pass，app 重启期间不影响 nginx 配置加载
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web3d_app http://web3d-app:8787;
        proxy_pass $web3d_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 带内容哈希的构建产物可永久缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 入口 HTML 不缓存，避免发版后仍引用旧 hash
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
